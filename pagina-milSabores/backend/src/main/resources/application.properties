server.port=8080

# MariaDB/MySQL local por defecto; DB_USER es solo el usuario (sin @localhost).
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ferreteria_los_maestros}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=1000
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:ferreteria-los-maestros-clave-secreta-para-desarrollo-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
